name: ASC inspect
# READ ONLY look at the App Store Connect record. Output is public (public repo), so it prints no private values.
on:
  workflow_dispatch:
  schedule:
    # Daily 01:30 UTC (08:30 WIB): surface review-queue changes (WAITING_FOR_REVIEW -> IN_REVIEW -> ...) without manual checks.
    - cron: '30 1 * * *'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          ruby scripts/ci/asc_inspect.rb
