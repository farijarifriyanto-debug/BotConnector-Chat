name: iOS TestFlight
# Manual: gh workflow run "iOS TestFlight" -f build_number=101 -f upload_testflight=true
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion (must be higher than the last upload of this version)'
        required: true
        default: '100'
      upload_testflight:
        description: 'Upload the IPA to TestFlight'
        type: boolean
        default: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: id.botconnector.app
      TEAM_ID: 7DD999P944
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name "Xcode_26*.app" | sort -V | tail -n 1)
          [ -n "$XCODE" ] || XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"; xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci

      - name: Check signing secrets
        id: sign
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          if [ -n "$CERT" ] && [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::error::Apple signing secrets are not set in this repository"; exit 1; fi

      - name: Generate the native iOS project
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          node -e "const f='app.json',j=require('./'+f);j.expo.ios.buildNumber=process.env.BUILD_NUMBER;require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          npx expo prebuild --platform ios --no-install
          cd ios && pod install

      - name: Keychain, certificate and API key
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          KC=$RUNNER_TEMP/build.keychain; KCP=$(openssl rand -base64 32)
          security create-keychain -p "$KCP" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          printf '%s' "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC"
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Fetch the App Store provisioning profile and sign the app target
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: ruby scripts/ci/fetch-provisioning-profile.rb

      - name: Archive and export
        run: |
          mkdir -p build/ipa
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROVISIONING_PROFILE_SPECIFIER}</string></dict>
          </dict></plist>
          PLIST
          WS=$(ls -d ios/*.xcworkspace | head -n 1); SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa -exportOptionsPlist build/ExportOptions.plist

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload_testflight != 'false' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          IPA=$(find build/ipa -name '*.ipa' -print -quit); test -n "$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: BotConnector-iOS-ipa
          path: build/ipa/*.ipa
