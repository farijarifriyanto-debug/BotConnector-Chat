name: ASC fill
# Fills the App Store record (metadata, screenshots, review notes). Never submits for review.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write to App Store Connect (false = print the plan only)'
        type: boolean
        default: false
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fill
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLY: ${{ github.event.inputs.apply == 'true' && '1' || '0' }}
          REVIEW_FIRST: ${{ secrets.REVIEW_FIRST }}
          REVIEW_LAST: ${{ secrets.REVIEW_LAST }}
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
          REVIEW_EMAIL: admin@botconnector.id
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          ruby scripts/ci/asc_fill.rb
